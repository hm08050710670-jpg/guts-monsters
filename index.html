<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>GUTS MONSTERS</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#101512;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;display:flex;justify-content:center}#g{width:min(100%,480px);min-height:100vh;background:#dce8cf;overflow:hidden;position:relative;color:#203028}header{height:56px;background:#173e2f;color:#fff;padding:7px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #d5b15a}.logo{font-weight:1000}.sm{font-size:11px}.world{height:540px;position:relative;overflow:hidden}#map{position:absolute;inset:0;display:grid;grid-template:repeat(14,1fr)/repeat(12,1fr)}.t{display:grid;place-items:center;overflow:hidden}.G{background:#91d17a}.R{background:linear-gradient(135deg,#ead99a,#d5bc79)}.X{background:#57a94d;color:#d8ef9e;font-size:18px}.X:before{content:"〽"}.T{background:linear-gradient(#70c35b 0 58%,#35793d 59%)}.T:before{content:"▲";font-size:31px;color:#9be478;text-shadow:-5px 5px #55a449,5px 5px #39803d}.W{background:repeating-linear-gradient(0deg,#5db8d6 0 5px,#78cce2 5px 10px)}.F{background:#91d17a}.F:before{content:"╫";font-size:25px;color:#dce1d8;text-shadow:2px 2px #65736b}.H{background:linear-gradient(#718fa4 0 24%,#ecd39e 25% 80%,#a88156 81%)}.H:before{content:"▦";font-size:23px;color:#477797}.D{background:#ecd39e}.D:before{content:"▣";font-size:25px;color:#3f6f8d}.S{background:#91d17a}.S:before{content:"▤";font-size:23px;color:#8b6548}#hero{position:absolute;width:8.333%;height:7.143%;z-index:5;display:grid;place-items:center;transition:left .07s,top .07s}.hero{font-size:25px;filter:drop-shadow(0 3px 1px #0004)}.dpad{position:absolute;z-index:9;left:12px;bottom:12px;width:142px;height:142px;padding:8px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:4px;background:#07130f66;border-radius:23px}.dpad button{border:1px solid #fff5;border-radius:11px;background:#14261fe8;color:#fff;font-size:21px;font-weight:900;touch-action:none}.mid{background:#fff2;border-radius:50%}.A{position:absolute;z-index:9;right:19px;bottom:25px;width:66px;height:66px;border-radius:50%;border:4px solid #ffd0c8;background:#b73d34;color:#fff;font-size:21px;font-weight:1000}.dialog{margin:0 7px 8px;min-height:94px;background:#fbfaf3;border:5px solid #65717a;border-radius:12px;box-shadow:inset 0 0 0 3px #fff;padding:12px 15px;font-weight:800;line-height:1.6}#battle{display:none;background:#102d23}.arena{height:285px;position:relative;background:linear-gradient(#9eddf1 0 48%,#9bd17a 48%);overflow:hidden}.arena:after{content:"";position:absolute;left:-10%;right:-10%;bottom:-55px;height:140px;border-radius:50%;background:#6ca456}.info{position:absolute;z-index:3;background:#fbf7e9;border:3px solid #34483e;border-radius:10px;padding:8px 10px}.ei{right:9px;top:14px;width:62%}.ai{left:9px;bottom:11px;width:60%}.hp{height:9px;background:#c8c6b8;border-radius:10px;overflow:hidden;margin-top:5px}.hp i{display:block;height:100%;background:#55c65f}.mon{position:absolute;z-index:2;font-size:76px}#enemy{left:36px;top:94px}#ally{right:27px;bottom:17px}.boardBox{padding:8px;background:#153d2f;border-top:4px solid #d5b15b}#board{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;touch-action:none}.orb{aspect-ratio:1;border-radius:50%;border:2px solid #fff9;display:grid;place-items:center;font-size:20px;box-shadow:inset 0 5px 7px #fff8,inset 0 -7px 10px #0004}.f{background:#ed584b}.gr{background:#55bd62}.w{background:#4baae5}.n{background:#dec458}.h{background:#e968a2}.bmsg{min-height:65px;background:#0a1c16;color:#fff;padding:10px 13px;font-weight:800}.ov{display:none;position:absolute;inset:56px 0 0;background:#08140fdf;z-index:30;padding:18px}.card{background:#faf4e5;border:4px solid #40564b;border-radius:15px;padding:15px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choices button,.ok{border:0;border-radius:10px;background:#236745;color:#fff;padding:12px;font-weight:900}
</style></head><body><div id="g"><header><div><div class="logo">GUTS MONSTERS</div><div class="sm">ガッツタウン</div></div><div class="sm" id="hud">相棒：なし</div></header><section id="field"><div class="world"><div id="map"></div><div id="hero"><div class="hero">🧢</div></div><div class="dpad"><span></span><button data-d="u">▲</button><span></span><button data-d="l">◀</button><div class="mid"></div><button data-d="r">▶</button><span></span><button data-d="d">▼</button><span></span></div><button class="A">A</button></div><div class="dialog" id="msg">オクムラ博士の研究所へ行こう。</div></section><section id="battle"><div class="arena"><div class="info ei"><b id="en"></b><div class="sm" id="et"></div><div class="hp"><i id="ehp"></i></div></div><div class="mon" id="enemy"></div><div class="info ai"><b id="an"></b><div class="sm" id="at"></div><div class="hp"><i id="ahp"></i></div></div><div class="mon" id="ally"></div></div><div class="boardBox"><div id="board"></div></div><div class="bmsg" id="bm">ボールをつかんで、指を離さずくるくる動かそう！</div></section><div class="ov" id="ov"><div class="card" id="card"></div></div></div><script>
(()=>{const $=s=>document.querySelector(s);let x=6,y=11,pet=null,stage=0,held=null,timer=null,drag=-1,orbs=[],enemy=null,eHP=0,eMax=1,aHP=44,aMax=44,lv=7,xp=0;const starters=[['キャロー','🌿','🐰'],['テラトラ','🔥','🐯'],['タイトン','💧','🐘'],['ピンピン','⚪','🐭']],wild=[['ハッパチ','🌿','🐝',40],['バッタフ','🌿','🦗',40],['ラフラビット','⚪','🐇',20]],pool=['🔥','🌿','💧','⚪','💗'];const L=["TTTTRRTTTTTT","TTTTRRTTHHHT","TTTTRRTTHDHT","FFXXRRFFFFFT","XXXXRRXXXXXX","GGGGRRGGGGGG","GFFGRRGWWWWG","GGGGRRGWWWWG","GGGGRRGGGGGG","WWWGRRGTTTTT","WWWGRRGTTTTT","GGGGRRGGGGGG","GGGGSSGGGGGG","GGGGRRGGGGGG"];
function map(){let m=$('#map');m.innerHTML='';for(let yy=0;yy<14;yy++)for(let xx=0;xx<12;xx++){let d=document.createElement('div');d.className='t '+L[yy][xx];m.appendChild(d)}render()}function render(){$('#hero').style.left=x/12*100+'%';$('#hero').style.top=y/14*100+'%';$('#hud').innerHTML=pet?pet[0]+' '+pet[1]+'<br>Lv.'+lv+' EXP '+xp:'相棒：なし'}function pass(nx,ny){if(nx<0||nx>11||ny<0||ny>13)return false;return !'TFWH'.includes(L[ny][nx])}function move(d){let nx=x,ny=y;if(d==='u')ny--;if(d==='d')ny++;if(d==='l')nx--;if(d==='r')nx++;if(!pass(nx,ny))return;x=nx;y=ny;render();if(!pet&&x===9&&y===2)choose();else if(pet&&stage===0&&y===0)battle(['ブブ','⚪','🐶'],7,true);else if(pet&&stage>0&&L[y][x]==='X'&&Math.random()<.22)encounter()}function stop(){held=null;if(timer)clearTimeout(timer)}function start(d){stop();held=d;move(d);timer=setTimeout(function r(){if(held!==d)return;move(d);timer=setTimeout(r,180)},290)}document.querySelectorAll('[data-d]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();start(b.dataset.d)};b.onpointerup=stop;b.onpointercancel=stop});function show(h){$('#card').innerHTML=h;$('#ov').style.display='block'}function hide(){$('#ov').style.display='none'}function choose(){show('<b>オクムラ博士</b><p>きみと一緒に冒険する相棒を選んでくれ！</p><div class="choices">'+starters.map((s,i)=>'<button data-s="'+i+'"><span style="font-size:34px">'+s[2]+'</span><br>'+s[0]+' '+s[1]+'</button>').join('')+'</div>');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{pet=starters[+b.dataset.s];hide();render();$('#msg').textContent=pet[0]+' Lv.7が相棒になった！ 北へ進もう。'})}function encounter(){let r=Math.random()*100,sum=0,w=wild[0];for(const z of wild){sum+=z[3];if(r<sum){w=z;break}}battle(w,3+Math.floor(Math.random()*3),false)}
function battle(e,elv,rival){if(rival)stage=1;enemy={name:e[0],type:e[1],icon:e[2],rival};eMax=rival?58:38+elv*3;eHP=eMax;aHP=aMax;$('#field').style.display='none';$('#battle').style.display='block';$('#en').textContent=(rival?'ノブオの ':'')+enemy.name+' Lv.'+elv;$('#et').textContent=enemy.type+'属性';$('#enemy').textContent=enemy.icon;$('#an').textContent=pet[0]+' Lv.'+lv;$('#at').textContent=pet[1]+'属性';$('#ally').textContent=pet[2];orbs=Array.from({length:30},()=>pool[Math.floor(Math.random()*pool.length)]);draw();bars()}function cls(o){return o==='🔥'?'f':o==='🌿'?'gr':o==='💧'?'w':o==='💗'?'h':'n'}function draw(){let b=$('#board');b.innerHTML='';orbs.forEach((o,i)=>{let q=document.createElement('div');q.className='orb '+cls(o);q.textContent=o;q.dataset.i=i;b.appendChild(q)})}function idx(e){let r=$('#board').getBoundingClientRect(),c=Math.floor((e.clientX-r.left)/(r.width/6)),rr=Math.floor((e.clientY-r.top)/(r.height/5));return Math.max(0,Math.min(4,rr))*6+Math.max(0,Math.min(5,c))}function adj(a,b){return Math.abs(a%6-b%6)+Math.abs(Math.floor(a/6)-Math.floor(b/6))===1}$('#board').onpointerdown=e=>{let q=e.target.closest('.orb');if(q){e.preventDefault();drag=+q.dataset.i}};$('#board').onpointermove=e=>{if(drag<0)return;e.preventDefault();let j=idx(e);if(j!==drag&&adj(drag,j)){[orbs[drag],orbs[j]]=[orbs[j],orbs[drag]];drag=j;draw()}};$('#board').onpointerup=()=>{if(drag>=0){drag=-1;resolve()}};
function matches(){let s=new Set;for(let r=0;r<5;r++){let st=0;for(let c=1;c<=6;c++){if(c===6||orbs[r*6+c]!==orbs[r*6+st]){if(c-st>=3)for(let k=st;k<c;k++)s.add(r*6+k);st=c}}}for(let c=0;c<6;c++){let st=0;for(let r=1;r<=5;r++){if(r===5||orbs[r*6+c]!==orbs[st*6+c]){if(r-st>=3)for(let k=st;k<r;k++)s.add(k*6+c);st=r}}}return s}function resolve(){let m=matches();if(!m.size){$('#bm').textContent='そろわなかった！もう一度くるくる動かそう。';return}let own=0,heal=0;m.forEach(i=>{if(orbs[i]===pet[1])own++;if(orbs[i]==='💗')heal++});eHP=Math.max(0,eHP-(m.size+own*3));aHP=Math.min(aMax,aHP+heal*2);m.forEach(i=>orbs[i]=pool[Math.floor(Math.random()*pool.length)]);draw();bars();if(eHP<=0){setTimeout(win,300);return}aHP=Math.max(0,aHP-(4+Math.floor(Math.random()*5)));bars();$('#bm').textContent=pet[0]+'が攻撃！ 敵も反撃してきた！';if(aHP<=0)setTimeout(lose,300)}function bars(){$('#ehp').style.width=eHP/eMax*100+'%';$('#ahp').style.width=aHP/aMax*100+'%'}function win(){xp+=18;$('#battle').style.display='none';$('#field').style.display='block';$('#msg').textContent=enemy.rival?'ノブオとの初勝負に勝った！ ガーデンロードへ進もう。':enemy.name+'を倒した！ EXPを獲得！';render()}function lose(){show('<b>戦闘不能！</b><p>回復センターで復活が必要です。</p><button class="ok" id="back">フィールドへ戻る</button>');$('#back').onclick=()=>{hide();$('#battle').style.display='none';$('#field').style.display='block';render()}}map()})();
</script></body></html>

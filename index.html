const flow=[
 ['title','GUTS MONSTERS','▶ はじめから　　つづきから　　せってい'],
 ['setup','主人公設定','名前と性別を決めよう。'],
 ['home','自宅','冒険の朝だ。オクムラ博士の研究所へ向かおう！'],
 ['town','ガッツタウン','町を歩いて、研究所を探そう。'],
 ['prof','オクムラ博士','ようこそ！ GUTS MONSTERSの世界へ。'],
 ['starter','オクムラ博士','ヒノカピ・シバモグ・アメピヨ。最初の相棒を1匹選ぼう。'],
 ['rival','ノブオ','よぉ！ オレはノブオ！ こいつはブブだ！'],
 ['route','ガーデンロード','草むらでは野生のGUTS MONSTERSと出会う。'],
 ['wild','野生のモンスター','シバモグが あらわれた！'],
 ['puzzle','BATTLE','1個つかんで、くるくる動かそう！'],
 ['drop','MONSTER DROP','勝利！ 仲間にできるチャンスだ。'],
 ['menu','MENU','モンスター・バッグ・マップ・レポート。']
];
let i=0,gender='male',name='ホーリー';
const scene=document.getElementById('scene'),cap=document.getElementById('caption'),prog=document.getElementById('progress');
function show(){
 const [img,sp,tx]=flow[i]; scene.style.backgroundImage=`url("${ART[img]}")`;
 cap.innerHTML=`<span class="speaker">${sp}</span><br>${tx}${img==='puzzle'?board():''}`;
 prog.textContent=(i+1)+' / '+flow.length;
 document.getElementById('controls').style.display=(['home','town','route'].includes(img)?'block':'none');
 if(img==='setup')document.getElementById('setup').hidden=false;
}
function board(){return '<div class="orbBoard">'+Array.from({length:30},(_,j)=>`<i class="orb o${j%5}"></i>`).join('')+'</div>'}
document.getElementById('A').onclick=next;
document.querySelectorAll('.dpad button').forEach(b=>b.onclick=()=>{cap.innerHTML='<span class="speaker">FIELD</span><br>主人公が1マス移動した。Aボタンで次のイベントへ。'});
function next(){if(i<flow.length-1){i++;show()}}
document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{gender=b.dataset.g;document.querySelectorAll('[data-g]').forEach(x=>x.classList.toggle('on',x===b))});
document.getElementById('start').onclick=()=>{name=document.getElementById('name').value||'ホーリー';document.getElementById('setup').hidden=true;i=2;show()};
scene.onclick=()=>{if(i===0){i=1;show()}else if(!['home','town','route'].includes(flow[i][0]))next()};
show();
</script></body></html>
